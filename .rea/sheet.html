<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{background:#333;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;font:11px monospace}
figure{margin:0;background:#fff;padding:4px}
img{width:100%;height:150px;object-fit:contain;background:#eee;display:block}
figcaption{color:#000;padding-top:2px;font-weight:bold}
</style></head><body>
<script>
const files = ['img-00.webp','img-01.webp','img-02.webp','img-03.webp','img-04.webp','img-05.webp','img-06.webp','img-07.webp','img-08.png','img-09.webp','img-10.webp','img-11.webp','img-12.webp','img-13.webp','img-14.webp','img-15.png','img-16.webp','texture-paper.webp'];
for (const f of files) {
  const fig = document.createElement('figure');
  const img = document.createElement('img');
  img.src = '../assets/img/' + f;
  const cap = document.createElement('figcaption');
  cap.textContent = f;
  fig.append(img, cap);
  document.body.appendChild(fig);
}
</script>
</body></html>
