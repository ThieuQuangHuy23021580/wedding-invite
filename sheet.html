<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #1e1e1e; font-family: monospace; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 6px; }
  .cell { background: #2b2b2b; border-radius: 5px; padding: 5px; }
  .cell img { width: 100%; height: 130px; object-fit: contain; display: block;
      background: repeating-conic-gradient(#3d3d3d 0% 25%, #333 0% 50%) 50% / 14px 14px; }
  .lbl { font-size: 11px; margin-top: 3px; color: #7f7; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  const files = [
    'img-00.webp','img-01.webp','img-02.webp','img-03.webp','img-04.webp',
    'img-05.webp','img-06.webp','img-07.webp','img-08.png','img-09.webp',
    'img-10.webp','img-11.webp','img-12.webp','img-13.webp','img-14.webp',
    'img-15.png','img-16.webp','texture-paper.webp','social-1.png','social-2.png',
    'social-3.png','img-17.svg','img-18.svg',
  ];
  const g = document.getElementById('g');
  for (const f of files) {
    const d = document.createElement('div');
    d.className = 'cell';
    const img = document.createElement('img');
    img.src = '/assets/img/' + f;
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = f;
    d.appendChild(img);
    d.appendChild(lbl);
    g.appendChild(d);
  }
</script>
</body>
</html>
